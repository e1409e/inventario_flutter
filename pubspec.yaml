name: inventario_pro
description: "Sistema multiplataforma de gestión de inventario y auditoría para Triple AAA Food Distribution."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistencia remota (Turso / libSQL) y bóveda local (Drift / SQLite)
  libsql_dart: ^0.9.0+0.9.30
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Arquitectura, estado e inyección de dependencias
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  flutter_dotenv: ^6.0.1

  # Utilidades y generación de reportes
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.3
  intl: ^0.19.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env